<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intranet Colegio La Hispanidad</title>
  <link rel="icon" type="image/png" href="https://prisma.bibliohispa.es/suite/iconos/intranet-64.png" />
  <link rel="apple-touch-icon" href="https://prisma.bibliohispa.es/suite/iconos/intranet-180.png" />
  <!-- Identidad común de la Suite La Hispanidad (cabecera, firma, escudo): se sirve desde Prisma -->
  <link rel="stylesheet" href="https://prisma.bibliohispa.es/suite/hispanidad-suite.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Figtree', 'sans-serif'],
          },
          colors: {
            // Sin violeta: la Suite La Hispanidad lo redirige a su celeste
            indigo: { 50: '#eef5fb', 100: '#d5e7f6', 200: '#abcfed', 300: '#78b1e0', 400: '#4a9ad8', 500: '#2373bd', 600: '#145ea6', 700: '#0a4a8c', 800: '#0b3d72', 900: '#0c325c', 950: '#081f3a' },
            violet: { 50: '#ecf9fe', 100: '#d2f0fc', 200: '#a6e1f8', 300: '#6ccdf2', 400: '#30b5e8', 500: '#0aa0dc', 600: '#0882b6', 700: '#0b6893', 800: '#0f5678', 900: '#124864', 950: '#0b2f42' },
            purple: { 50: '#ecf9fe', 100: '#d2f0fc', 200: '#a6e1f8', 300: '#6ccdf2', 400: '#30b5e8', 500: '#0aa0dc', 600: '#0882b6', 700: '#0b6893', 800: '#0f5678', 900: '#124864', 950: '#0b2f42' },
            hispa: {
              // Derived from the logo (Dark Slate Blue/Teal)
              red: '#234B6E',
              darkRed: '#18354f',
              // Secondary accent (Lighter Blue)
              blue: '#5D9BC9',
            }
          }
        },
      },
    }
  </script>
  <style>
    /* Custom Scrollbar for Webkit */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #475569;
    }

    /* ============ GLASS HEADER ============ */
    .header-glass {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(24px) saturate(1.6);
      -webkit-backdrop-filter: blur(24px) saturate(1.6);
      border-bottom: 1px solid rgba(0, 0, 0, 0.07);
    }
    .dark .header-glass {
      background: rgba(5, 5, 20, 0.45);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* ============ WATERMARK LOGO ============ */
    body::after {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80vmin;
      height: 80vmin;
      background-image: url('/logo.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.05;
      pointer-events: none;
      z-index: 9999;
    }

    .dark body::after {
      opacity: 0.03;
      filter: grayscale(1) invert(1) brightness(2);
    }

    :root {
      --mesh-tutor: radial-gradient(ellipse at 15% 50%, rgba(20, 94, 166, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 30%, rgba(79, 70, 229, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 90%, rgba(67, 56, 202, 0.08) 0%, transparent 50%),
        linear-gradient(135deg, #f5f3ee 0%, #eef1f5 50%, #f8fafc 100%);
    }

    .dark {
      --mesh-tutor: radial-gradient(ellipse at 15% 50%, rgba(20, 94, 166, 0.35) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 30%, rgba(79, 70, 229, 0.3) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 90%, rgba(67, 56, 202, 0.2) 0%, transparent 50%),
        linear-gradient(135deg, #06121f 0%, #0b223d 50%, #0f172a 100%);
    }

    body {
      background: var(--mesh-tutor);
      background-attachment: fixed;
    }
  </style>
</head>

<body class="text-slate-800 dark:text-slate-100 transition-colors duration-300">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
